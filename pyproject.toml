[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "numpy>=1.24",
]
build-backend = "scikit_build_core.build"

[project]
name = "hpgl"
version = "2.0.1"
description = "High Performance Geostatistics Library - Modern C++ with Python bindings"
readme = "readme.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Artur Muharlyamov", email = "muharlyamovar@ufanipi.ru"},
    {name = "Andrew Bezrukov", email = "bezrukovav@ufanipi.ru"},
    {name = "Konstantin Barsky", email = "barskykd@ufanipi.ru"},
]
maintainers = [
    {name = "HPGL Team", email = "hpgl@ufanipi.ru"},
]
keywords = [
    "geostatistics",
    "kriging",
    "spatial",
    "variogram",
    "simulation",
    "SGS",
    "SIS",
    "indicator-kriging",
    "cokriging",
    "scientific-computing",
    "geoscience",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "scipy>=1.10",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "mypy>=1.5",
    "ruff>=0.1.0",
    "bandit>=1.7",
]

# Testing dependencies
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "scipy>=1.10",
]

# Documentation dependencies
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]

# All development dependencies
all = [
    "hpgl[dev,test,docs]",
]

[project.urls]
Homepage = "https://github.com/hpgl/hpgl"
Documentation = "https://github.com/hpgl/hpgl"
Repository = "https://github.com/hpgl/hpgl"
Issues = "https://github.com/hpgl/hpgl/issues"
Changelog = "https://github.com/hpgl/hpgl"

[tool.uv]
# Don't build/install the project itself (C++ is built separately via build.bat/CMake)
package = false

[tool.scikit-build]
# Minimum CMake version
cmake.version = ">=3.20"

# CMake configuration
cmake.args = [
    "-DHPGL_BUILD_PYTHON=ON",
    "-DHPGL_USE_OPENMP=ON",
    "-DHPGL_USE_MKL=OFF",
]

# Wheel configuration
wheel.py-api = "py3"

# Build directory settings
build-dir = "build/{wheel_tag}"

# Ninja build backend (faster than default)
ninja.make-fallback = true

# Strict mode for better compatibility
strict-config = true

# Logging
logging.level = "INFO"

[tool.scikit-build.sdist]
# Explicit inclusion mode: only files matching `include` are shipped, and
# `exclude` patterns WIN over `include`. In the default mode include wins, so
# the broad `src/` include re-added stale compiled artifacts (.dylib/.so/.pyc)
# that the excludes tried to remove (I2-44). The build-critical root files
# (pyproject.toml, CMakeLists.txt, CMakePresets.json) are listed explicitly
# because nothing is included by default in this mode.
inclusion-mode = "explicit"

# Include these files in source distribution
include = [
    "pyproject.toml",
    "CMakeLists.txt",
    "CMakePresets.json",
    "license.txt",
    "readme.md",
    "src/",
    "cmake/",
]

# Exclude these files from source distribution
exclude = [
    "**/*.pyc",
    "**/__pycache__",
    "**/.git",
    "**/.github",
    "**/build/",
    "**/dist/",
    "**/*.egg-info",
    # Exclude compiled/platform-specific binaries from sdist
    "**/*.so",
    "**/*.dylib",
    "**/*.dll",
    "**/*.pyd",
    # Exclude compiler/linker intermediate files
    "**/*.obj",
    "**/*.o",
    "**/*.lib",
    "**/*.exp",
    "**/*.pdb",
    "**/*.ilk",
]

[tool.cibuildwheel]
# Build wheels for all supported Python versions
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"

# Skip 32-bit builds and PyPy
skip = "*-win32 *-manylinux_i686 pp*"

# Testing commands
# Verify not just import but that the native library loaded and key API is present.
# The wheel installs the source package as `geo_bsd` (importable top-level
# package) — the distribution name is `hpgl`, so `importlib.metadata.version`
# still resolves it (I2-07: align with the actual import name).
test-command = "python -c \"import geo_bsd; v = geo_bsd.__version__; assert v, 'no version'; assert hasattr(geo_bsd, 'simple_kriging'), 'API missing'; print(f'geo_bsd {v} OK')\""

# Environment variables
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }

[tool.cibuildwheel.linux]
# Use manylinux2014 for broader compatibility
archs = ["x86_64", "aarch64"]
before-all = "yum install -y openblas-devel || { apt-get update && apt-get install -y libopenblas-dev; }"

[tool.cibuildwheel.macos]
# Build for both x86_64 and arm64 (Apple Silicon)
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
before-all = "brew install openblas libomp cmake && export OpenMP_ROOT=$(brew --prefix libomp) && export LDFLAGS=\"-L$(brew --prefix openblas)/lib -L$(brew --prefix libomp)/lib\" && export CPPFLAGS=\"-I$(brew --prefix openblas)/include -I$(brew --prefix libomp)/include\""

[tool.cibuildwheel.windows]
# Build for x64 only
archs = ["AMD64"]
before-all = "choco install -y openblas || (echo 'WARNING: OpenBLAS not installed via Chocolatey. Ensure BLAS/LAPACK is available (MKL or OpenBLAS) or wheel build will fail.' && exit 0)"
environment = { BLA_VENDOR = "OpenBLAS" }
# NOTE: The before-all command installs OpenBLAS via Chocolatey (available on
# GitHub Actions Windows runners). If Chocolatey is unavailable or OpenBLAS
# installation fails, the build will still proceed but CMake will fail with
# a clear error when it cannot find BLAS/LAPACK.
# Alternative approaches for non-GitHub-Actions Windows environments:
#   - Install Intel MKL via OneAPI installer beforehand
#   - Use a self-hosted runner with MKL_ROOT set
#   - Install OpenBLAS via vcpkg before invoking cibuildwheel

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "src/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "legacy: marks tests migrated from legacy test suite",
]

[tool.coverage.run]
source = ["src/geo_bsd"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"src/geo_bsd/__init__.py" = ["F403", "F405"]  # wildcard import
"tests/**/*.py" = ["S101"]  # assert allowed in tests

[tool.ruff.lint.isort]
known-first-party = ["hpgl", "geo"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["hpgl", "geo"]

[tool.bandit]
exclude_dirs = ["build", "dist", ".git", ".venv", "__pycache__", "legacy_documentation"]
skips = ["B101"]  # skip assert detection — hpgl uses bare assert intentionally for debug (see PY-003)
